name: "dataforge"
version: "1.0.0"
config-version: 2
profile: "dataforge"

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dataforge:
    staging:
      +materialized: view
      +schema: staging
      +tags: ["bank"]
    marts:
      +materialized: table
      +schema: marts
      +tags: ["bank"]

seeds:
  dataforge:
    +schema: staging
    +tags: ["bank"]
    expense_categories_seed:
      +column_types:
        updated_at: timestamp
