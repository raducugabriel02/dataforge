version: 2

models:
  - name: dim_date
    # time_spine: dim_date e deja un date-spine complet (dbt_utils.date_spine,
    # 2024-2028) — il refolosim ca time spine cerut de Semantic Layer in loc
    # sa duplicam un model nou doar pentru asta.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_key
        tests: [unique, not_null]
      - name: date_day
        tests: [unique, not_null]
        granularity: day

  - name: dim_merchant
    columns:
      - name: merchant_key
        tests: [unique, not_null]
      - name: default_category_name
        tests:
          - accepted_values:
              arguments:
                values:
                  [
                    "groceries",
                    "utilities",
                    "transport",
                    "dining",
                    "entertainment",
                    "transfer",
                    "income",
                    "uncategorized",
                    "gambling",
                    "cash",
                    "fees",
                    "health",
                  ]

  - name: dim_expense_category
    # Contract: forma SCD2 (category_key/valid_from/valid_to/is_current) e
    # citita direct de fact_financial_transactions.sql printr-un join
    # point-in-time — o redenumire sau schimbare de tip aici ar trece
    # neobservata de dbt daca modelul consumator nu refera explicit coloana
    # in select, dar pica direct build-ul cu contractul activat.
    config:
      contract:
        enforced: true
    columns:
      - name: category_key
        data_type: text
        tests: [unique, not_null]
      - name: category_name
        data_type: text
      - name: category_group
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: ["essential", "discretionary", "transfer", "income", "uncategorized"]
      - name: valid_from
        data_type: timestamp without time zone
      - name: valid_to
        data_type: timestamp without time zone
      - name: is_current
        data_type: boolean

  - name: fact_financial_transactions
    config:
      materialized: incremental
      unique_key: transaction_id
      on_schema_change: fail
      contract:
        enforced: true
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: transaction_id
        data_type: text
        tests: [unique, not_null]
      - name: txn_date
        # Coloana literala (nu doar date_key, FK-ul surogat) — necesara ca
        # agg_time_dimension pentru Semantic Layer (semantic_layer.yml):
        # MetricFlow are nevoie de un timp real pe modelul cu metricile,
        # nu poate deriva "metric_time" doar dintr-un FK catre alt model.
        data_type: date
        tests: [not_null]
      - name: date_key
        data_type: text
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: merchant_key
        data_type: text
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_merchant')
                field: merchant_key
      - name: category_key
        data_type: text
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_expense_category')
                field: category_key
      - name: source_bank
        data_type: text
      - name: description
        data_type: text
      - name: amount
        data_type: numeric(12,2)
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -10000
                max_value: 10000
      - name: balance_after
        data_type: numeric(12,2)
      - name: currency
        data_type: text

  - name: mart_monthly_spending
    # Contract: consumat direct de Metabase (dashboard "Cheltuieli — Overview")
    # — o coloana redenumita aici ar rupe o intrebare Metabase silentios
    # (Metabase nu ruleaza teste dbt), nu doar un model downstream.
    config:
      contract:
        enforced: true
    columns:
      - name: month_start
        data_type: date
        tests: [unique, not_null]
      - name: total_spending
        data_type: numeric(14,2)
        tests: [not_null]
      - name: total_income
        data_type: numeric(14,2)
        tests: [not_null]
      - name: net_cashflow
        data_type: numeric(14,2)
      - name: cumulative_spending
        data_type: numeric(14,2)
      - name: rolling_3_month_avg
        data_type: numeric(14,2)
      - name: delta_vs_previous_month
        data_type: numeric(14,2)

  - name: mart_account_balances
    # Periodic snapshot fact (grain: banca x luna) — sold de sfarsit de
    # luna, forward-fill in lunile fara tranzactii. Contract enforced la
    # fel ca celelalte marts finance, ca sa protejam mart_financial_health
    # (care il consuma direct) de o redenumire silentioasa.
    config:
      contract:
        enforced: true
    columns:
      - name: source_bank
        data_type: text
        tests: [not_null]
      - name: month_start
        data_type: date
        tests: [not_null]
      - name: balance_eom_filled
        data_type: numeric(14,2)
        tests: [not_null]
      - name: is_forward_filled
        data_type: boolean
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_bank, month_start]

  - name: mart_financial_health
    # Contract: consumat (sau va fi) direct de Metabase, la fel ca
    # mart_monthly_spending — vezi comentariul de acolo.
    config:
      contract:
        enforced: true
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: month_start
        data_type: date
        tests: [unique, not_null]
      - name: total_spending
        data_type: numeric(14,2)
        tests: [not_null]
      - name: total_income
        data_type: numeric(14,2)
        tests: [not_null]
      - name: net_cashflow
        data_type: numeric(14,2)
      - name: rolling_3_month_avg
        data_type: numeric(14,2)
      - name: delta_vs_previous_month
        data_type: numeric(14,2)
      - name: net_worth_eom
        data_type: numeric(14,2)
      - name: net_worth_trend_3m
        data_type: numeric(14,2)
      - name: savings_rate
        data_type: numeric(10,4)
      - name: forecast_next_month_spending
        data_type: numeric(14,2)

  - name: mart_budget_alerts
    # Contract: singurul mart citit prin SQL brut din Python
    # (ingestion/alerts/checker.py), nu doar din alte modele dbt — un
    # dbt test normal n-ar prinde o redenumire de coloana aici, doar o
    # eroare de runtime in AlertChecker. Contractul o prinde la `dbt build`.
    config:
      contract:
        enforced: true
    columns:
      - name: category_name
        data_type: text
        tests: [not_null]
      - name: month_start
        data_type: date
        tests: [not_null]
      - name: monthly_budget_ron
        data_type: integer
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true
      - name: actual_spending
        data_type: numeric(14,2)
      - name: is_over_budget
        data_type: boolean
      - name: pct_of_budget
        data_type: numeric(14,2)
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [category_name, month_start]
