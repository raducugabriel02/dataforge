[project]
name = "dataforge"
version = "0.1.0"
description = "Personal Data Platform & ELT Warehouse"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "loguru>=0.7",
    "tenacity>=8.2",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
]
dbt = [
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
]
pdf = [
    # doar pentru scripts/convert_bt_pdf_statement.py — cand banca ofera extrasul
    # numai in PDF, nu si CSV/Excel. Nu e folosit de pipeline-ul de productie.
    "pdfplumber>=0.11",
]
semantic-layer = [
    # dbt Semantic Layer / MetricFlow, rulat local (nu dbt Cloud) — interogare
    # generativa a metricilor peste marts, fara SQL nou per combinatie de
    # dimensiuni. Grup separat de `dbt` fiindca nu e necesar pipeline-ului
    # de productie (ingest/dbt build/Airflow), doar pentru explorare/interviu.
    "dbt-metricflow[postgres]>=0.15",
]

[tool.setuptools.packages.find]
include = ["ingestion*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires a running Postgres (docker compose up)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
# dags/ rulează doar în imaginea Docker a Airflow (dependințe instalate acolo, nu în .venv local)
exclude = ["dbt_project/", "data/", "dags/"]
