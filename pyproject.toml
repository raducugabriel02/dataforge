[project]
name = "dataforge"
version = "0.1.0"
description = "Personal Data Platform & ELT Warehouse"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "loguru>=0.7",
    "tenacity>=8.2",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
]
dbt = [
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
]

[tool.setuptools.packages.find]
include = ["ingestion*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires a running Postgres (docker compose up)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["dbt_project/", "data/"]
